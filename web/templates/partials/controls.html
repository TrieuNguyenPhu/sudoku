{{define "controls"}}
<div class="game-controls">
    <div class="difficulty-controls">
        <button id="easy-btn" class="difficulty-btn">Easy</button>
        <button id="medium-btn" class="difficulty-btn">Medium</button>
        <button id="hard-btn" class="difficulty-btn">Hard</button>
    </div>
    
    <div class="action-controls">
        <button id="solve-btn" class="action-btn">Solve Puzzle</button>
        <button id="clear-btn" class="action-btn">Clear Grid</button>
        <button id="validate-btn" class="action-btn">Validate</button>
    </div>
</div>
{{end}}
