{{define "content"}}
<div class="game-container">
    <div class="controls">
        <button id="easy-btn" class="difficulty-btn">Easy</button>
        <button id="medium-btn" class="difficulty-btn">Medium</button>
        <button id="hard-btn" class="difficulty-btn">Hard</button>
        <button id="solve-btn" class="action-btn">Solve</button>
    </div>
    
    <div class="sudoku-container">
        {{template "sudoku_grid" .}}
    </div>
    
    <div class="status">
        <p id="status-message">Select a difficulty to start playing!</p>
    </div>
</div>
{{end}}

{{template "layouts/base.html" .}}
